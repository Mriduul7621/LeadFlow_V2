plugins { id 'com.android.application' }

android {
    namespace 'com.saudalmahi.leadflow'
    compileSdk 34

    defaultConfig {
        applicationId 'com.saudalmahi.leadflow'
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    // Committed standard debug credentials (android/android). For a release
    // build, swap this file + passwords for the production signing key.
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            keyAlias 'androiddebugkey'
            storePassword 'android'
            keyPassword 'android'
            storeType 'PKCS12'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
