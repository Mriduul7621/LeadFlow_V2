<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#978C21" />
    <title>LeadFlow — No connection</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background: #f7f7f2;
        color: #263238;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 360px;
        width: 100%;
        text-align: center;
      }
      .mark { margin: 0 auto 20px; }
      h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
      p { font-size: 15px; line-height: 1.5; color: #575756; margin-bottom: 6px; }
      .bn { font-size: 14px; }
      button {
        margin-top: 20px;
        appearance: none;
        border: 0;
        border-radius: 999px;
        background: #f37021;
        color: #fff;
        font-size: 16px;
        font-weight: 700;
        padding: 12px 32px;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      .hint { margin-top: 16px; font-size: 13px; color: #8a8a89; }
    </style>
  </head>
  <body>
    <div class="card">
      <!-- LeadFlow mark (same art as public/icon.svg): olive tile, cream
           funnel, olive flow line, orange drop. -->
      <svg class="mark" width="72" height="72" viewBox="0 0 512 512" aria-hidden="true">
        <rect width="512" height="512" rx="112" fill="#978C21" />
        <path d="M148 104 L364 104 Q388 104 380 126 L288 264 L288 340 Q288 364 264 364 L248 364 Q224 364 224 340 L224 264 L132 126 Q124 104 148 104 Z" fill="#F7F2E9" />
        <line x1="256" y1="152" x2="256" y2="348" stroke="#978C21" stroke-width="26" stroke-linecap="round" />
        <circle cx="256" cy="400" r="26" fill="#F7F2E9" />
        <circle cx="256" cy="400" r="18" fill="#F37021" />
      </svg>
      <h1>No connection</h1>
      <p>LeadFlow needs the internet. Check your mobile data or Wi-Fi and try again.</p>
      <p class="bn">ইন্টারনেট সংযোগ নেই। মোবাইল ডেটা বা Wi-Fi চালু করে আবার চেষ্টা করো।</p>
      <button type="button" id="retry">Retry</button>
      <p class="hint">If the app looks out of date, close it fully and reopen it.</p>
    </div>
    <script>
      // The shell loads the live LeadFlow remotely; this page only exists
      // for the offline case, so a retry is a full navigation to the live
      // URL (which also clears any stale deployment the WebView was pinned
      // to).
      var LEADFLOW_URL = "https://lead-flow-jet.vercel.app";
      document.getElementById("retry").addEventListener("click", function () {
        window.location.href = LEADFLOW_URL;
      });
      // Recover automatically the moment connectivity returns.
      window.addEventListener("online", function () {
        window.location.href = LEADFLOW_URL;
      });
    </script>
  </body>
</html>
